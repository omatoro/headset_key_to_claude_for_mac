       形状は assets/icon.svg (アプリアイコン)と同一。背景と色を除き、
       余白を切り詰めてモチーフがキャンバスいっぱいに出るようにしたもの
       (余白込みだとメニューバーで小さく見える・マスター指摘)。 -->

  <!-- ヘッドバンド -->
  <path d="M 262 640 L 262 500 A 250 250 0 0 1 762 500 L 762 640"
        stroke="#000" stroke-width="60" fill="none" stroke-linecap="round"/>

  <!-- 左右のイヤーカップ -->
  <rect x="204" y="612" width="112" height="184" rx="54" fill="#000"/>
  <rect x="708" y="612" width="112" height="184" rx="54" fill="#000"/>

  <!-- 中央のスパーク -->
  <g stroke="#000" stroke-width="36" stroke-linecap="round">
    <line x1="512" y1="452" x2="512" y2="560"/>
    <line x1="512" y1="704" x2="512" y2="812"/>
    <line x1="332" y1="632" x2="440" y2="632"/>
    <line x1="584" y1="632" x2="692" y2="632"/>
    <line x1="391" y1="511" x2="465" y2="585"/>
    <line x1="559" y1="679" x2="633" y2="753"/>
    <line x1="633" y1="511" x2="559" y2="585"/>
    <line x1="465" y1="679" x2="391" y2="753"/>
  </g>
  <circle cx="512" cy="632" r="34" fill="#000"/>
</svg>
